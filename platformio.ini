[platformio]
default_envs = e2_s3_units
src_dir = examples

[env:e2_s3_units]
build_src_filter = +<units_preview/main.cpp>
; FieldCore build provenance: docs/reference/04_co2control_platform.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = e2_s3_n16r8
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = examples/common/partitions_16mb.csv
board_upload.maximum_size = 8323072
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = MotorControl-RS=symlink://.
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
; Ports are chosen explicitly at upload/monitor time; this example performs no RS485 I/O.

[env:e2_s3_probe]
extends = env:e2_s3_units
build_src_filter =
    +<probe_cli/main.cpp>
    +<probe_cli/ProbeConsole.cpp>
    +<common/RtuRunner.cpp>
    +<common/E2Uart.cpp>
; Read-only ESS probe bench. No automatic bus traffic at startup.

[platformio]
default_envs = bench_s3_units
src_dir = examples

[env:bench_s3_units]
build_src_filter = +<units_preview/main.cpp>
; Bench SDK/build provenance: docs/reference/04_esp32_bench.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = bench_s3_n16r8
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = examples/common/partitions_16mb.csv
board_upload.maximum_size = 8323072
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = MotorControl-RS=symlink://.
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
; Ports are chosen explicitly at upload/monitor time; this example performs no RS485 I/O.

[env:bench_s3_probe]
extends = env:bench_s3_units
build_src_filter =
    +<probe_cli/main.cpp>
    +<probe_cli/ProbeConsole.cpp>
    +<common/RtuRunner.cpp>
    +<common/Esp32S3Uart.cpp>
; Read-only ESS probe bench. No automatic bus traffic at startup.

[env:bench_s3_load_poll]
extends = env:bench_s3_probe
build_src_filter = ${env:bench_s3_probe.build_src_filter} +<probe_cli/Esp32Load.cpp>
build_flags = ${env:bench_s3_units.build_flags} -DMOTORCONTROLRS_LOAD_FIXTURE=1

[env:bench_s3_load_timer]
extends = env:bench_s3_load_poll
build_flags = ${env:bench_s3_load_poll.build_flags} -DMOTORCONTROLRS_TIMER_CAPTURE=1
